<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>تابعني — ورقة الشعار</title>
<style>
 body{margin:0;padding:36px;background:#F7F4ED;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#14100A}
 .card{background:#fff;border:1px solid #ECE6DA;border-radius:22px;padding:26px;margin-bottom:20px}
 .dark{background:#14100A;border-color:#14100A}.dark h2,.dark .cap{color:#B4A996}
 h2{font-size:13px;color:#6B6152;margin:0 0 16px;font-weight:600;letter-spacing:.02em}
 .row{display:flex;align-items:center;gap:36px;flex-wrap:wrap}
 img{display:block}
 .cap{font-size:12px;color:#6B6152;margin-top:10px}
 .tile{text-align:center}
</style></head><body>
<div class="card"><h2>الشعار الكامل — خلفية فاتحة / كريمية</h2><div class="row">
  <img src="logo/master/tabaani-logo-stacked.png" height="220">
  <img src="logo/master/tabaani-logo-stacked.png" height="140">
  <img src="logo/master/tabaani-logo-stacked.png" height="90">
</div></div>
<div class="card dark"><h2>الشعار الكامل — خلفية أونيكس</h2><div class="row">
  <img src="logo/master/tabaani-logo-stacked.png" height="220">
  <img src="logo/master/tabaani-logo-stacked.png" height="120">
</div></div>
<div class="card"><h2>الرمز منفردًا + كلمة الشعار</h2><div class="row">
  <img src="logo/master/tabaani-mark.png" height="120">
  <img src="logo/master/tabaani-wordmark-gold.png" height="64">
  <div class="tile"><img src="logo/master/tabaani-mark-64.png" height="64"><div class="cap">64px</div></div>
  <div class="tile"><img src="logo/master/tabaani-mark-32.png" height="32"><div class="cap">32px</div></div>
  <div class="tile"><img src="logo/master/tabaani-mark-16.png" height="16"><div class="cap">16px</div></div>
</div></div>
<div class="card"><h2>أيقونات التطبيق (رمزي على أونيكس)</h2><div class="row">
  <img src="../site/assets/img/appicon-512.png" height="120" style="border-radius:26px">
  <img src="../site/assets/img/appicon-192.png" height="120" style="border-radius:26px">
  <img src="../site/assets/img/appicon-180.png" height="90" style="border-radius:22px">
</div></div>
</body></html>
