  <!-- وضع الإنقاذ: ?fresh=1 يمسح الكاش ويسجّل الخدمة ثم يعيد التحميل -->
  <script>
    (function () {
      try {
        if (!/[?&]fresh=1/.test(location.search)) return;
        var done = false;
        function go() { if (done) return; done = true; location.replace(location.pathname); }
        var jobs = [];
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }).catch(function () {}));
        }
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).catch(function () {}));
        }
        Promise.all(jobs).then(go).catch(go);
        setTimeout(go, 2500);
      } catch (e) {}
    })();
  </script>

/* تسجيل عامل الخدمة: يشتغل على https (GitHub Pages) — للعمل بلا إنترنت وللتثبيت كتطبيق */
var secure = (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
/* مانيفست التطبيق يُضاف على https فقط (على file:// يسبب خطأ CORS بلا فائدة) */
if (secure) {
  var mf = document.createElement('link'); mf.rel = 'manifest'; mf.href = 'manifest.webmanifest';
  document.head.appendChild(mf);
}
if ('serviceWorker' in navigator && secure) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (r) { window.__SW__ = r; }).catch(function () {});
  });
}
</script>
